<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肺结节 CT · 科研工作站</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><strong>肺结节分析</strong><span id="context">研究项目 / 病例队列</span><span class="notice">仅供科研，不用于临床诊断</span><button id="queueButton">病例队列</button><button id="exportButton" disabled>导出预览</button></header>
<section id="queue"><div class="sectionTitle"><h1>研究项目 / 病例队列</h1><span>本地离线 · 单次胸部 CT</span></div><div class="cards"><form id="projectForm"><h2>建立研究项目</h2><label>项目研究代号<input name="name" required placeholder="LUNG-2026"></label><label>操作者研究代号<input name="operator" required placeholder="READER-01"></label><button>创建项目</button></form><div><h2>继续项目</h2><select id="projects"><option value="">选择研究项目</option></select><p>仅使用获准的已脱敏数据。无需模型也可人工复核。</p><label>病例筛选<input id="caseFilter" placeholder="研究病例号"></label><label>复核状态<select id="caseStatus"><option value="">全部</option><option value="draft">草稿</option><option value="reviewing">复核中</option><option value="completed">已完成</option></select></label></div><form id="importForm"><h2>导入检查</h2><label>已批准本地目录<input name="directory" required placeholder="输入启动时批准的目录"></label><label>数据来源代号<input name="source_code" required placeholder="DATASET-01"></label><label>研究来源<select name="research_source"><option value="unknown">未知</option><option value="screening">筛查</option><option value="non_screening">非筛查</option></select></label><label class="check"><input type="checkbox" name="consent" required>确认授权、已脱敏、已核查像素烧录信息，且为成人胸部非增强 CT</label><button>导入检查</button></form></div><div id="cases"></div></section>
<main id="workstation" hidden><div class="viewerColumn"><div class="toolbar"><span id="caseLabel"></span><label>窗位<input id="center" type="number" value="-600"></label><label>窗宽<input id="width" type="number" min="1" value="1500"></label><button id="lungWindow">肺窗</button><button id="resetView">重置视图</button><label class="check"><input id="overlays" type="checkbox" checked>叠加</label></div><div class="viewport"><canvas id="axial"></canvas><span id="loadingLabel" hidden>正在加载原始切片…</span><span id="leftLabel" class="orientation left"></span><span id="rightLabel" class="orientation right"></span><span id="topLabel" class="orientation top"></span><span id="imageLabel"></span></div><div class="toolbar"><button id="previousSlice">上一层</button><input id="slice" type="range" min="0" value="0"><button id="nextSlice">下一层</button><span id="sliceLabel"></span><button id="returnFinding">返回该结节</button></div><div class="toolbar tools"><button id="addFinding" disabled>手动添加</button><button id="longAxis" disabled>绘制长径</button><button id="shortAxis" disabled>绘制短径</button><span id="toolHint">滚轮翻层 · 右键拖动平移 · Ctrl+滚轮缩放</span></div></div><aside><section class="locator"><div class="sectionTitle"><strong>患者冠状定位</strong><span>右 R ← → L 左</span></div><canvas id="coronal"></canvas><p>只读定位 · 患者本人影像</p></section><section id="reviewPanel"><div class="sectionTitle"><strong>结节复核</strong><span id="count">0 项</span></div><div id="runStatus">未配置检测模型，可继续人工标注</div><div class="toolbar"><button id="startRun" disabled>开始 AI 分析</button><button id="manualDraft" disabled>人工复核</button></div><select id="findingFilter"><option value="">全部观察</option><option value="pending">待复核</option><option value="confirmed">已确认</option><option value="excluded">已排除</option><option value="uncertain">存疑</option></select><div id="findings"><p>尚无观察记录</p></div><div id="findingEditor"></div><div id="completion"></div></section></aside></main>
<section id="exportPanel" hidden></section><footer><span id="status" role="status">准备就绪</span><span>研究数据仅保存在本机</span></footer><script type="module" src="/static/export-ui.js"></script></body></html>
